name: iPhone/iPad bug report
description: Report a reproducible build, install, UI, JIT, or emulation problem
title: "[iOS] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Use the open-source smoke fixture when possible and remove all private identifiers from logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and content check
      options:
        - label: I did not attach a game image, firmware, key, BIOS/IPL dump, pairing file, save, provisioning profile, Apple credential, team ID, or device identifier.
          required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release tag
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Mac model, macOS, Xcode, iPhone/iPad model, and iOS/iPadOS version—no serial numbers or UDIDs
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failure stage
      options:
        - Readiness or dependencies
        - Simulator build or smoke test
        - Signing or packaging
        - Device installation or launch
        - JIT attachment
        - Library or file import
        - Rendering, audio, controls, or saves
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the command and the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Paste only the relevant excerpt after removing private paths and identifiers.
      render: shell
