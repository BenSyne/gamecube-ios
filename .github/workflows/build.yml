name: Public source checks

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Pull requests run only on a GitHub-hosted runner without repository secrets.
# Full iOS builds and device tests require a local Mac with Xcode and signing.
permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install archive inspector
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Check agent instructions, shell syntax, and public source boundary
        run: Tools/iOS/audit_public_release.sh
